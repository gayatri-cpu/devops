server.port=8080
spring.application.name=vaccination-reminder-portal

# In-memory H2 Database for seamless deployment without external DB setup
spring.datasource.url=jdbc:h2:mem:vaxdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Health Checks for Docker and Jenkins Quality Gates
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.vaxguard=INFO
logging.level.org.springframework.web=INFO
