version: '3.8'

services:
  vaxguard-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vaxguard/vaccination-portal:1.0.0
    container_name: vaxguard-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - vaxguard-net

networks:
  vaxguard-net:
    driver: bridge
