[vax_servers]
target-node-01 ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[vax_servers:vars]
app_name=vaccination-reminder-portal
app_version=1.0.0
app_port=8080
deploy_mode=docker # options: 'docker' or 'systemd'
deploy_dir=/opt/vaccination-portal
app_user=vaxadmin
app_group=vaxadmin
